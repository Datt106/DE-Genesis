name: de-genesis

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: .docker/airflow/Dockerfile
  image: de-genesis-airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-de_user}:${POSTGRES_PASSWORD:-de_password}@postgres:5432/${POSTGRES_DB:-de_roadmap}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-de_genesis_local_secret}
    POSTGRES_DB: ${POSTGRES_DB:-de_roadmap}
    POSTGRES_HOST: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de_password}
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-de_user}
    SPARK_DRIVER_HOST: airflow-scheduler
    SPARK_MASTER_URL: spark://spark-master:7077
    PYTHONPATH: /workspace
    MOCK_API_URL: http://mock-api:8000
    AIRFLOW_API_USERNAME: ${AIRFLOW_API_USERNAME:-admin}
    AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-admin}
    WEEK6_INVALID_RATE_THRESHOLD: ${WEEK6_INVALID_RATE_THRESHOLD:-0}
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - de-genesis
  profiles:
    - workflow
  volumes:
    - ./:/workspace
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs

services:
  mock-api:
    build:
      context: .
      dockerfile: mock_api/Dockerfile
    container_name: de-genesis-mock-api
    environment:
      PROMOTION_SEED_FILE: /data/olist/olist_products_dataset.csv
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - de-genesis
    ports:
      - "${MOCK_API_PORT:-8000}:8000"
    profiles:
      - workflow
    volumes:
      - ./data/olist:/data/olist:ro

  workspace:
    build:
      context: .
      dockerfile: .docker/workspace/Dockerfile
    container_name: de-genesis-workspace
    command: sleep infinity
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      HDFS_NAMENODE: hdfs://namenode:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MYSQL_DATABASE: ${MYSQL_DATABASE:-de_roadmap}
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-de_password}
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-de_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-de_password}
      POSTGRES_DB: ${POSTGRES_DB:-de_roadmap}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de_password}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-de_user}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace
      SPARK_MASTER_URL: spark://spark-master:7077
    networks:
      - de-genesis
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./:/workspace

  postgres:
    image: postgres:16-alpine
    container_name: de-genesis-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-de_roadmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de_password}
      POSTGRES_USER: ${POSTGRES_USER:-de_user}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - de-genesis
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  mysql:
    image: mysql:8.0
    container_name: de-genesis-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-de_roadmap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-de_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_USER: ${MYSQL_USER:-de_user}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - de-genesis
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: de-genesis-namenode
    environment:
      CLUSTER_NAME: de-genesis
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: 1
    networks:
      - de-genesis
    ports:
      - "${HDFS_NAMENODE_PORT:-9870}:9870"
      - "${HDFS_RPC_PORT:-9000}:9000"
    profiles:
      - bigdata
      - streaming
      - workflow
      - monitoring
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - ./:/workspace:ro

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: de-genesis-datanode
    depends_on:
      - namenode
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_replication: 1
      SERVICE_PRECONDITION: namenode:9870
    networks:
      - de-genesis
    profiles:
      - bigdata
      - streaming
      - workflow
      - monitoring
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
      - ./:/workspace:ro

  spark-master:
    build:
      context: .
      dockerfile: .docker/spark/Dockerfile
    image: de-genesis-spark:3.5.1-python3.11
    container_name: de-genesis-spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      SPARK_MASTER_OPTS: -Dspark.ui.prometheus.enabled=true
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    networks:
      - de-genesis
    ports:
      - "${SPARK_MASTER_WEB_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    profiles:
      - bigdata
      - streaming
      - workflow
      - monitoring
    volumes:
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - ./:/workspace

  spark-worker:
    build:
      context: .
      dockerfile: .docker/spark/Dockerfile
    image: de-genesis-spark:3.5.1-python3.11
    container_name: de-genesis-spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8081"]
    depends_on:
      - spark-master
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_OPTS: -Dspark.ui.prometheus.enabled=true
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
      SPARK_WORKER_WEBUI_PORT: 8081
    networks:
      - de-genesis
    ports:
      - "${SPARK_WORKER_WEB_PORT:-8081}:8081"
    profiles:
      - bigdata
      - streaming
      - workflow
      - monitoring
    volumes:
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - ./:/workspace

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: de-genesis-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_NODE_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks:
      - de-genesis
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    profiles:
      - streaming
      - workflow
      - monitoring
    volumes:
      - kafka_data:/var/lib/kafka/data

  airflow-init:
    <<: *airflow-common
    container_name: de-genesis-airflow-init
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_USERNAME:-admin}
      --password ${AIRFLOW_PASSWORD:-admin}
      --firstname Data
      --lastname Engineer
      --role Admin
      --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    container_name: de-genesis-airflow-webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mock-api:
        condition: service_healthy
    ports:
      - "${AIRFLOW_PORT:-8088}:8080"

  airflow-scheduler:
    <<: *airflow-common
    container_name: de-genesis-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mock-api:
        condition: service_healthy

  nifi:
    build:
      context: .
      dockerfile: .docker/nifi/Dockerfile
    image: de-genesis-nifi:local
    container_name: de-genesis-nifi
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:-admin_password_123}
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USER:-admin}
      AIRFLOW_API_URL: http://airflow-webserver:8080
      AIRFLOW_API_USERNAME: ${AIRFLOW_API_USERNAME:-admin}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-admin}
      MOCK_API_URL: http://mock-api:8000
      POSTGRES_DB: ${POSTGRES_DB:-de_roadmap}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de_password}
      POSTGRES_USER: ${POSTGRES_USER:-de_user}
    depends_on:
      airflow-webserver:
        condition: service_started
      mock-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - de-genesis
    ports:
      - "${NIFI_PORT:-8443}:8443"
    profiles:
      - workflow
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - ./exercises/week5/nifi:/opt/nifi/week5:ro

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: de-genesis-prometheus
    depends_on:
      pipeline-metrics:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - de-genesis
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    profiles:
      - monitoring
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus

  pipeline-metrics:
    build:
      context: .
      dockerfile: exercises/week6/monitoring/Dockerfile
    container_name: de-genesis-pipeline-metrics
    depends_on:
      airflow-webserver:
        condition: service_started
      mock-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW_HEALTH_URL: http://airflow-webserver:8080/health
      METRICS_PORT: "9108"
      MOCK_API_HEALTH_URL: http://mock-api:8000/health
      POSTGRES_DB: ${POSTGRES_DB:-de_roadmap}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-de_password}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-de_user}
      SPARK_HEALTH_URL: http://spark-master:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9108/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - de-genesis
    ports:
      - "${PIPELINE_METRICS_PORT:-9108}:9108"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.3
    container_name: de-genesis-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
    networks:
      - de-genesis
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    profiles:
      - monitoring
    volumes:
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

networks:
  de-genesis:
    driver: bridge

volumes:
  airflow_logs:
  grafana_data:
  hadoop_datanode:
  hadoop_namenode:
  kafka_data:
  mysql_data:
  nifi_conf:
  nifi_content:
  nifi_database:
  nifi_flowfile:
  nifi_provenance:
  postgres_data:
  prometheus_data:
