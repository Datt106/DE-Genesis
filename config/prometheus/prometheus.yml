global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: spark-master
    metrics_path: /metrics/master/prometheus
    static_configs:
      - targets:
          - spark-master:8080

  - job_name: spark-worker
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - spark-worker:8081

  - job_name: pipeline-metrics
    static_configs:
      - targets:
          - pipeline-metrics:9108
